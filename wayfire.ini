# ARCHNEMESIS · Wayfire 0.11

[core]
plugins = animate autostart blur command cube decoration expo foreign-toplevel grid idle move place resize scale session-lock simple-tile switcher vswitch window-rules wm-actions wobbly
close_top_view = <super> KEY_W
vwidth = 5
vheight = 2
background_color = 0.098 0.090 0.141 1.0
preferred_decoration_mode = server

[input]
xkb_layout = us
mouse_cursor_speed = 0.0
mouse_natural_scroll = false
tap_to_click = true
tap_and_drag = true
disable_touchpad_while_typing = true

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = kitty
binding_browser = <super> KEY_B
command_browser = helium-browser
binding_file_manager = <super> KEY_E
command_file_manager = dolphin
binding_launcher = <super> KEY_SPACE
command_launcher = $HOME/.config/rofi/launchers/launcher.sh
binding_video_editor = <super> KEY_G
command_video_editor = kdenlive
binding_neovim = <super> KEY_N
command_neovim = kitty nvim
binding_clipboard = <super> KEY_V
command_clipboard = $HOME/.config/rofi/clipboard/clipboard.sh
binding_wallpaper = <super> <alt> KEY_SPACE
command_wallpaper = $HOME/.config/wayfire/scripts/wallpaper-picker.sh
binding_lock = <super> <alt> KEY_L
command_lock = $HOME/.config/wayfire/scripts/lock.sh
binding_screenshot_region = <alt> KEY_Z | KEY_PRINT
command_screenshot_region = $HOME/.config/hypr/scripts/screenshot.sh region
binding_screenshot_full = <shift> KEY_PRINT
command_screenshot_full = $HOME/.config/hypr/scripts/screenshot.sh full

always_binding_volume_up = KEY_VOLUMEUP
command_volume_up = wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
always_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
always_binding_volume_mute = KEY_MUTE
command_volume_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
always_binding_mic_mute = KEY_MICMUTE
command_mic_mute = wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
always_binding_brightness_up = KEY_BRIGHTNESSUP
command_brightness_up = brightnessctl set 5%+
always_binding_brightness_down = KEY_BRIGHTNESSDOWN
command_brightness_down = brightnessctl set 5%-
always_binding_media_next = KEY_NEXTSONG
command_media_next = playerctl next
always_binding_media_play = KEY_PLAYPAUSE
command_media_play = playerctl play-pause
always_binding_media_pause = KEY_PAUSE
command_media_pause = playerctl play-pause
always_binding_media_previous = KEY_PREVIOUSSONG
command_media_previous = playerctl previous

[autostart]
autostart_wf_shell = false
00_dbus = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP
10_archnemesis = $HOME/.config/wayfire/scripts/autostart.sh

[animate]
open_animation = fade
close_animation = fade
minimize_animation = squeezimize
duration = 180ms
squeezimize_duration = 150ms linear
startup_duration = 180ms linear

[blur]
blur_by_default = type is "toplevel"
method = kawase
saturation = 0.9
alpha_threshold = 0.5
kawase_iterations = 2

[cube]
activate = <super> <ctrl> <alt> KEY_C
rotate_left = <super> <ctrl> <alt> KEY_LEFT
rotate_right = <super> <ctrl> <alt> KEY_RIGHT
deform = 0
zoom = 0.08
initial_animation = 250ms
background_mode = simple
background = #191724ff

[decoration]
font = Iosevka Nerd Font Mono 10
font_color = #e0def4ff
title_height = 25
border_size = 2
active_color = #c4a7e7ff
inactive_color = #393552dd

[expo]
toggle = <super> <ctrl> <alt> KEY_E
background = #191724f2
duration = 220ms
offset = 8
keyboard_interaction = true
inactive_brightness = 0.72
transition_length = 180
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4
select_workspace_5 = KEY_5
select_workspace_6 = KEY_6
select_workspace_7 = KEY_7
select_workspace_8 = KEY_8
select_workspace_9 = KEY_9
select_workspace_10 = KEY_0

[grid]
duration = 180ms
type = crossfade
slot_bl = <super> KEY_KP1
slot_b = <super> KEY_KP2
slot_br = <super> KEY_KP3
slot_l = <super> KEY_KP4
slot_c = <super> KEY_KP5
slot_r = <super> KEY_KP6
slot_tl = <super> KEY_KP7
slot_t = <super> KEY_KP8
slot_tr = <super> KEY_KP9
restore = <super> KEY_KP0

[idle]
screensaver_timeout = -1
dpms_timeout = 600
disable_on_fullscreen = true

[move]
activate = <super> BTN_LEFT
enable_snap = true
snap_threshold = 12
quarter_snap_threshold = 42

[place]
mode = center

[resize]
activate = <super> BTN_RIGHT

[scale]
toggle = <super> <ctrl> <alt> KEY_P
duration = 260ms
spacing = 28
outer_margin = 18
inactive_alpha = 0.78
title_overlay = all
title_font_size = 14
bg_color = #191724e6
text_color = #e0def4ff

[simple-tile]
tile_by_default = app_id is "__archnemesis_never__"
key_toggle = <super> KEY_L
key_focus_left = <super> KEY_H
key_focus_right = <super> KEY_RIGHT
key_focus_above = <super> KEY_K
key_focus_below = <super> KEY_J
inner_gap_size = 4
outer_horiz_gap_size = 8
outer_vert_gap_size = 8
animation_duration = 120ms
preview_base_color = #c4a7e766
preview_base_border = #c4a7e7cc
preview_border_width = 2

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

[wm-actions]
toggle_maximize = <super> KEY_M

[vswitch]
duration = 180ms
gap = 14
background = #191724ff
wraparound = false
binding_1 = <super> KEY_1
binding_2 = <super> KEY_2
binding_3 = <super> KEY_3
binding_4 = <super> KEY_4
binding_5 = <super> KEY_5
binding_6 = <super> KEY_6
binding_7 = <super> KEY_7
binding_8 = <super> KEY_8
binding_9 = <super> KEY_9
binding_10 = <super> KEY_0
with_win_1 = <super> <shift> KEY_1
with_win_2 = <super> <shift> KEY_2
with_win_3 = <super> <shift> KEY_3
with_win_4 = <super> <shift> KEY_4
with_win_5 = <super> <shift> KEY_5
with_win_6 = <super> <shift> KEY_6
with_win_7 = <super> <shift> KEY_7
with_win_8 = <super> <shift> KEY_8
with_win_9 = <super> <shift> KEY_9
with_win_10 = <super> <shift> KEY_0

[wobbly]
friction = 3.0
spring_k = 8.0
grid_resolution = 6

[window-rules]
# Add app-specific rules when a real workflow needs them.
